name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Require tag/package version match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as file:
              version = tomllib.load(file)["package"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag must be {expected}, got {os.environ['RELEASE_TAG']}")
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --locked
      - run: python3 tests/live_openrouter.py --examples
      - run: python3 ci/check.py
      - run: node --test tests/npm.mjs
      - name: Prepare publish metadata smoke
        run: python3 ci/prepare_release.py "$GITHUB_REPOSITORY"
      - run: cargo package --locked
      - run: npm pack ./packages/npm --dry-run
      - name: Build Python distributions
        run: |
          python3 -m pip install --disable-pip-version-check build
          python3 -m build packages/python --outdir /tmp/pypi-dist

  binaries:
    name: Binary ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: ""
            rustflags: ""
            macos_target: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extension: ""
            rustflags: ""
            macos_target: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
            rustflags: ""
            macos_target: "10.12"
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ""
            rustflags: ""
            macos_target: "11.0"
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: ".exe"
            rustflags: "-C target-feature=+crt-static"
            macos_target: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: ".exe"
            rustflags: "-C target-feature=+crt-static"
            macos_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Select native musl linker
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          key="CARGO_TARGET_${TARGET^^}_LINKER"
          key="${key//-/_}"
          echo "$key=musl-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if readelf -l "target/$TARGET/release/shell-is-all-you-need" | grep -q 'INTERP'; then
            echo 'Linux release binary has a dynamic interpreter' >&2
            exit 1
          fi
      - name: Prepare binary and SHA-256
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shutil

          target = os.environ["TARGET"]
          extension = os.environ["EXTENSION"]
          asset = f"shell-is-all-you-need-{target}{extension}"
          source = Path("target") / target / "release" / f"shell-is-all-you-need{extension}"
          output = Path("release-assets")
          output.mkdir()
          destination = output / asset
          shutil.copy2(source, destination)
          checksum = hashlib.sha256(destination.read_bytes()).hexdigest()
          (output / f"{asset}.sha256").write_text(
              f"{checksum}  {asset}\n", encoding="ascii"
          )
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  github-release:
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release with all binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi

  publish-crates:
    name: Publish crates.io
    needs: github-release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
      - name: Prepare repository metadata
        run: python3 ci/prepare_release.py "$GITHUB_REPOSITORY"
      - name: Select crates.io authentication
        id: cargo-auth-mode
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            printf 'CARGO_REGISTRY_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        id: crates-auth
        if: steps.cargo-auth-mode.outputs.trusted == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Use trusted-publishing credential
        if: steps.cargo-auth-mode.outputs.trusted == 'true'
        env:
          TRUSTED_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          test -n "$TRUSTED_TOKEN"
          echo "::add-mask::$TRUSTED_TOKEN"
          printf 'CARGO_REGISTRY_TOKEN=%s\n' "$TRUSTED_TOKEN" >> "$GITHUB_ENV"
      - name: Publish shell-is-all-you-need
        run: cargo publish --locked

  publish-npm:
    name: Publish npm
    needs: github-release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Prepare repository metadata
        run: python3 ci/prepare_release.py "$GITHUB_REPOSITORY"
      - name: Configure npm bootstrap credential
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            printf 'NODE_AUTH_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          fi
      - name: Publish shell-is-all-you-need
        run: npm publish ./packages/npm --access public

  build-pypi:
    name: Build PyPI distributions
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare repository metadata
        run: python3 ci/prepare_release.py "$GITHUB_REPOSITORY"
      - run: python3 -m pip install --disable-pip-version-check build
      - run: python3 -m build packages/python --outdir dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI
    needs: build-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
